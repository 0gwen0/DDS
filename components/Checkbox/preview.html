<!-- @dsCard group="Selection Controls" height=140 -->
<div id="root" style="display: flex; gap: 32px; align-items: center;"></div>
<script>
  (function () {
    var e = window.React.createElement;
    var root = window.ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      e(
        React.Fragment,
        null,
        e(
          'div',
          { style: { display: 'flex', flexDirection: 'column', gap: '8px', alignItems: 'center' } },
          e(window.DDS.Checkbox, { checked: false }),
          e('span', { style: { fontSize: '12px', color: '#92929E' } }, 'unchecked')
        ),
        e(
          'div',
          { style: { display: 'flex', flexDirection: 'column', gap: '8px', alignItems: 'center' } },
          e(window.DDS.Checkbox, { checked: true }),
          e('span', { style: { fontSize: '12px', color: '#92929E' } }, 'checked')
        ),
        e(
          'div',
          { style: { display: 'flex', flexDirection: 'column', gap: '8px', alignItems: 'center' } },
          e(window.DDS.Checkbox, { checked: true, rounded: true }),
          e('span', { style: { fontSize: '12px', color: '#92929E' } }, 'rounded')
        )
      )
    );
  })();
</script>
