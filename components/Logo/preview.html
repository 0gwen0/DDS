<div id="root"></div>
<script>
  var e = window.React.createElement;
  var root = window.ReactDOM.createRoot(document.getElementById('root'));

  function Row(props) {
    return e(
      'div',
      { style: { display: 'flex', alignItems: 'center', gap: '32px', padding: '20px', background: props.bg, borderRadius: '12px' } },
      props.children
    );
  }

  root.render(
    e(
      'div',
      { style: { display: 'flex', flexDirection: 'column', gap: '16px', padding: '16px', fontFamily: 'var(--font-sans)' } },
      e(
        Row,
        { bg: '#FFFFFF' },
        e(window.DDS.Logo, { variant: 'full', tone: 'color', color: 'primary', size: 40 }),
        e(window.DDS.Logo, { variant: 'symbol', tone: 'color', size: 40 }),
        e(window.DDS.Logo, { variant: 'full', tone: 'mono-black', size: 40 })
      ),
      e(
        Row,
        { bg: '#17171E' },
        e(window.DDS.Logo, { variant: 'full', tone: 'color', color: 'reverse', size: 40 }),
        e(window.DDS.Logo, { variant: 'symbol', tone: 'color', color: 'reverse', size: 40 }),
        e(window.DDS.Logo, { variant: 'full', tone: 'mono-white', size: 40 })
      )
    )
  );
</script>
