<div id="root" style="display: flex; flex-direction: column; gap: 16px;"></div>
<script>
  (function () {
    var e = window.React.createElement;
    var React = window.React;
    var root = window.ReactDOM.createRoot(document.getElementById('root'));

    function Demo() {
      var state = React.useState(0);
      return e(
        window.React.Fragment,
        null,
        e(
          'div',
          { style: { display: 'flex', gap: '8px' } },
          e(window.DDS.Chip, { label: '전체', selected: true }),
          e(window.DDS.Chip, { label: '투자금 입금' })
        ),
        e(window.DDS.ChipGroup, {
          items: ['전체', '투자금 입금', '투자금 출금', '배당금', '기타'],
          selected: state[0],
          onChange: state[1]
        })
      );
    }

    root.render(e(Demo));
  })();
</script>
